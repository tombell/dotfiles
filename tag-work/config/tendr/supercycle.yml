root: ~/Code/madesuper

after_start:
  - |
    workspace_id="$(herdr workspace list | jq -er '.result.workspaces[0].workspace_id')"
    herdr workspace focus "$workspace_id"

workspaces:
  - label: supercycle
    root: ./supercycle
    tabs:
      - label: app
        root: ./web
        commands:
          - bin/rails s -p 58802
      - label: jobs
        root: ./web
        commands:
          - bin/jobs
      - label: mcp
        root: ./web
        # commands:
        #   - bin/rails s -p 62770 -c mcp.ru -P tmp/pids/mcp.pid
      - label: vite:theme
        root: ./extensions/theme
        commands:
          - yarn vite:dev
      - label: vite:frontend
        root: ./web/frontend
        commands:
          - yarn vite --port 3000
      - label: shopify
        commands:
          - shopify app dev
      - label: tunnel
        commands:
          - bin/tunnel -n tom
      - label: console
        root: ./web
        commands:
          - bin/rails console
      - label: agent
        commands:
          - claude
      - label: terminal
  - label: supercycle:cli
    root: ./supercycle-cli
    tabs:
      - label: agent
      - label: editor
  - label: supercycle:docs
    root: ./supercycle-docs
    tabs:
      - label: agent
      - label: editor
