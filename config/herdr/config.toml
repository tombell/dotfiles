onboarding = false

[theme]
name = "tokyo-night"
auto_switch = false

[theme.custom]
surface_dim = "#292e42"

[ui]
pane_scrollbars = false

[ui.sound]
enabled = false

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"], ["$jj_bookmark", "$jj_status"]]
row_gap = 1

[ui.sidebar.agents]
row_gap = 1

[keys]
prefix = "ctrl+b"
detach = "prefix+d"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[experimental]
kitty_graphics = true
