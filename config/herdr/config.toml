onboarding = false

[theme]
name = "tokyo-night"
auto_switch = false

[theme.custom]
# Sagittarius A palette, overriding the built-in base theme.
accent = "#F2B49D"
panel_bg = "#11101C"
sidebar_bg = "#080711"
active_row_bg = "#302536"
selection_bg = "#4A3646"
surface0 = "#211B2B"
surface1 = "#443345"
surface_dim = "#302536"
overlay0 = "#9B8294"
overlay1 = "#C5A5AD"
text = "#F4D9C4"
subtext0 = "#C5A5AD"
mauve = "#D59AAA"
green = "#B6C99B"
yellow = "#F5D49D"
red = "#E39494"
blue = "#8DBDE0"
teal = "#F2B49D"
peach = "#F2B49D"

[ui]
pane_scrollbars = false

[ui.sound]
enabled = false

[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  ["$jj_bookmark", "$jj_status"]
]

[ui.sidebar.agents]
row_gap = 1

[keys]
prefix = "ctrl+b"
detach = "prefix+d"
previous_tab = ["prefix+p", "cmd+shift+["]
next_tab = ["prefix+n", "cmd+shift+]"]
previous_workspace = "alt+shift+["
next_workspace = "alt+shift+]"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[experimental]
kitty_graphics = true
