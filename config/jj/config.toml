"$schema" = "https://jj-vcs.github.io/jj/latest/config-schema.json"

[user]
name = "Tom Bell"
email = "tomb@tombell.dev"

[ui]
default-command = "log"
diff-formatter = "difft"

[merge-tools.difft]
diff-args = ["--color=always", "--width=$width", "--display=side-by-side-show-both", "$left", "$right"]

[aliases]
fetch = ["git", "fetch"]
push = ["git", "push"]

l = ["log", "-r", "(main..@):: | (main..@)-"]
ll = ["log", "-r", "all()"]

d = ["diff"]
r = ["rebase"]
re = ["restore"]

bsm = ["bookmark", "set", "main"]
