root: ~/Code/starkwm

after_start:
  - |
    set workspace_id "$(herdr workspace list | jq -er '.result.workspaces[0].workspace_id')"
    herdr workspace focus "$workspace_id"

workspaces:
  - label: swm
    root: ./swm
    tabs:
      - label: agent
      - label: terminal

  - label: skbd
    root: ./skbd
    tabs:
      - label: agent
      - label: terminal

  - label: sbar
    root: ./sbar
    tabs:
      - label: agent
      - label: terminal

  - label: sborders
    root: ./sborders
    tabs:
      - label: agent
      - label: terminal

  - label: stags
    root: ./stags
    tabs:
      - label: agent
      - label: terminal

  - label: website
    root: ./website
    tabs:
      - label: server
        commands:
          - hugo server
      - label: agent
      - label: terminal
