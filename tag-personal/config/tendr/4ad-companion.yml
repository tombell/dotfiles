root: ~/Code/4ad-companion

after_start:
  - |
    workspace_id="$(herdr workspace list | jq -er '.result.workspaces[0].workspace_id')"
    herdr workspace focus "$workspace_id"

workspaces:
  - label: companion
    root: ./companion
    tabs:
      - label: editor
      - label: agent
  - label: website
    root: ./website
    tabs:
      - label: server
        commands:
          - hugo server
      - label: editor
      - label: agent
