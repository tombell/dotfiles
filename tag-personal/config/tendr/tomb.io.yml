root: ~/Code/tombell/tomb.io

after_start:
  - |
    set workspace_id "$(herdr workspace list | jq -er '.result.workspaces[0].workspace_id')"
    herdr workspace focus "$workspace_id"

workspaces:
  - label: website
    root: ./
    tabs:
      - label: hugo
        commands:
          - hugo server --buildDrafts --buildFuture
      - label: agent
        commands:
          - pi
      - label: terminal
