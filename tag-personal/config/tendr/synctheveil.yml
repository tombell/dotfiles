root: ~/Code/synctheveil

after_start:
  - |
    workspace_id="$(herdr workspace list | jq -er '.result.workspaces[0].workspace_id')"
    herdr workspace focus "$workspace_id"

workspaces:
  - label: design
    root: ./design
    tabs:
      - label: editor
      - label: agent
  - label: docs
    root: ./documentation
    tabs:
      - label: editor
      - label: agent
  - label: website
    root: ./website
    tabs:
      - label: server
        commands:
          - hugo server
      - label: editor
      - label: agent
  - label: app
    root: ./app
    tabs:
      - label: editor
      - label: agent
