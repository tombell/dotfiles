root: ~/Code/synctheveil

after_start:
  - |
    set workspace_id "$(herdr workspace list | jq -er '.result.workspaces[0].workspace_id')"
    herdr workspace focus "$workspace_id"

workspaces:
  - label: design
    root: ./design
    tabs:
      - label: agent
        command: pi
      - label: terminal
  - label: website
    root: ./website
    tabs:
      - label: server
        commands:
          - hugo server
      - label: agent
      - label: terminal
