root: ~/Code/tombell

after_start:
  - |
    workspace_id="$(herdr workspace list | jq -er '.result.workspaces[0].workspace_id')"
    herdr workspace focus "$workspace_id"

workspaces:
  - label: app
    root: ./conjuror
    tabs:
      - label: agent
        commands:
          - pi
      - label: editor
      - label: terminal
