root: ~/Code/conjuror-app

after_start:
  - |
    set workspace_id "$(herdr workspace list | jq -er '.result.workspaces[0].workspace_id')"
    herdr workspace focus "$workspace_id"

workspaces:
  - label: app
    root: ./conjuror
    tabs:
      - label: agent
        commands:
          - pi
      - label: terminal
  - label: website
    root: ./website
    tabs:
      - label: server
        commands:
          - hugo server
      - label: agent
        commands:
          - codex
      - label: terminal
